  <script>
    // 確認コード計算(crypto.subtle)はHTTPSでのみ動作するため強制リダイレクト
    if (location.protocol === "http:" && location.hostname !== "localhost") {
      location.replace(location.href.replace(/^http:/, "https:"));
    }
  </script>

    body {

      background: #f5f6f8; color: #1f2933; min-height: 100vh; padding: 2rem 1rem; line-height: 1.6;
    }
    a { color: #2563eb; }

    .container {
      max-width: 560px; margin: 0 auto; background: #ffffff; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); padding: 2rem;
    }
    .course { color: #52606d; font-size: 0.85rem; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 0.3rem; }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    .lead { color: #52606d; font-size: 0.9rem; margin-bottom: 1.5rem; }
    label { display: block; font-weight: 700; margin-bottom: 0.4rem; }
    input[type="text"], select {
      width: 100%; padding: 0.6rem 0.8rem; font-size: 1rem; border: 1px solid #cbd2d9; border-radius: 8px;
      margin-bottom: 1rem; background: #ffffff;
    }
    button {
      display: block; width: 100%; padding: 0.8rem; font-size: 1.05rem; font-weight: 700; color: #ffffff;
      background: #2563eb; border: none; border-radius: 8px; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .verdict {
      display: none; margin-top: 1.5rem; border-radius: 8px; padding: 1rem; font-weight: 700; text-align: center; font-size: 1.1rem;
    }
    .verdict.ok { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .verdict.ng { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .back-link { display: inline-block; margin-top: 1.5rem; font-size: 0.9rem; }
  </style>
</head>

    <label for="v-id">学籍番号</label>
    <input type="text" id="v-id" autocomplete="off">

    <label for="v-name">氏名</label>
    <input type="text" id="v-name" autocomplete="off">

    <label for="v-time">提出時間(表示どおり)</label>
    <input type="text" id="v-time" autocomplete="off" placeholder="2026年10月3日 09:25:12">

    <label for="v-code">確認コード</label>
    <input type="text" id="v-code" autocomplete="off" placeholder="XXXX-XXXX">

    <button type="button" onclick="verify()">照合する</button>

    <div class="verdict" id="verdict"></div>

    <a class="back-link" href="index.html">← 講義サイトのトップに戻る</a>
  </div>

  <script src="code.js"></script>
  <script>
    async function verify() {
      var pageId = document.getElementById("v-page").value;
      var id = document.getElementById("v-id").value;
      var name = document.getElementById("v-name").value;
      var timeText = document.getElementById("v-time").value;
      var code = document.getElementById("v-code").value.trim().toUpperCase();
      var box = document.getElementById("verdict");

      if (!id.trim() || !name.trim() || !timeText.trim() || !code) {
        box.className = "verdict ng";
        box.textContent = "すべての欄を入力してください。";
        box.style.display = "block";
        return;
      }

      var expected = await computeCode(pageId, id, name, timeText);
      if (expected === code) {
        box.className = "verdict ok";
        box.textContent = "✓ 一致(改ざんは検出されませんでした)";
      } else {
        box.className = "verdict ng";
        box.textContent = "✗ 不一致(内容が書き換えられている可能性があります)";
      }
      box.style.display = "block";
    }
  </script>
</body>
</html>
